global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-demo

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          system: oncall
          service: prometheus

  # Windows 开发环境使用 windows_exporter 暴露主机指标。
  # 安装后应监听 9182 端口；Docker Desktop 通过 host.docker.internal 访问宿主机。
  - job_name: windows-exporter
    static_configs:
      - targets:
          - host.docker.internal:9182
        labels:
          system: oncall-demo
          service: data-sync-service
          station: local-demo
