global:
  # 演示环境使用较短周期，让故障注入后可以快速观察 pending/firing 状态。
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local-demo

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          system: oncall
          service: prometheus

  # 电网数据采集与同步模拟服务运行在宿主机 9105 端口。
  # Docker Desktop / Linux host-gateway 均通过 host.docker.internal 访问。
  - job_name: grid-service-simulator
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:9105
        labels:
          system: grid-oncall-demo
          region: demo-grid-region
          station: demo-control-center
          service: grid-data-sync-service
