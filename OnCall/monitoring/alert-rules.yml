groups:
  - name: grid-service-alerts
    rules:
      - alert: GridDataSyncServiceDown
        expr: up{job="grid-service-simulator"} == 0
        for: 15s
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "电网数据同步服务不可用"
          description: "服务 {{ $labels.service }} 的指标端点已连续 15 秒无法抓取。"

      - alert: GridCommunicationInterrupted
        expr: |
          grid_station_online{job="grid-service-simulator"}
          <
          grid_station_total{job="grid-service-simulator"}
        for: 15s
        labels:
          severity: critical
          category: communication
        annotations:
          summary: "部分电网站点通信中断"
          description: "服务 {{ $labels.service }} 检测到在线站点数量低于应接入站点总数。"

      - alert: GridTelemetryQueueBacklog
        expr: grid_telemetry_queue_depth{job="grid-service-simulator"} > 1000
        for: 15s
        labels:
          severity: warning
          category: processing
        annotations:
          summary: "电网遥测消息严重积压"
          description: "服务 {{ $labels.service }} 的待处理遥测消息已连续 15 秒超过 1000 条。"

      - alert: GridDataSyncFailureRateHigh
        expr: grid_data_sync_failure_rate{job="grid-service-simulator"} > 20
        for: 15s
        labels:
          severity: critical
          category: data-sync
        annotations:
          summary: "电网数据同步失败率过高"
          description: "服务 {{ $labels.service }} 的数据同步失败率已连续 15 秒超过 20%。"

      - alert: GridDataFreshnessDelayHigh
        expr: grid_data_freshness_seconds{job="grid-service-simulator"} > 30
        for: 15s
        labels:
          severity: warning
          category: data-quality
        annotations:
          summary: "电网遥测数据更新延迟"
          description: "服务 {{ $labels.service }} 的最新遥测数据已连续 15 秒超过 30 秒未更新。"

      - alert: GridTelemetryProcessingLatencyHigh
        expr: grid_telemetry_processing_latency_seconds{job="grid-service-simulator"} > 2
        for: 15s
        labels:
          severity: warning
          category: processing
        annotations:
          summary: "电网遥测处理延迟过高"
          description: "服务 {{ $labels.service }} 的遥测处理耗时已连续 15 秒超过 2 秒。"
